<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechMovies | Filmes e séries</title>
  <meta name="description" content="TechMovies: plataforma de streaming com busca, minha lista, avaliações e comentários.">
  <meta name="theme-color" content="#0b1116">
  <link rel="icon" href="img/icone.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#view">Ir para o conteúdo</a>

  <!-- Login, cadastro e recuperação de senha -->
  <dialog id="dAuth" class="auth" aria-label="Conta">
    <button class="fechar" data-fechar aria-label="Fechar">&times;</button>
    <div class="auth__card">
      <img class="auth__logo" src="img/logo.png" alt="TechMovies" width="200">
      <p id="authMsg" class="authmsg" role="status"></p>
      <div class="abas" role="tablist">
        <button role="tab" id="tabEntrar" aria-selected="true" aria-controls="fEntrar" data-painel="entrar">Entrar</button>
        <button role="tab" id="tabCriar" aria-selected="false" aria-controls="fCriar" data-painel="criar">Criar conta</button>
      </div>
      <form id="fEntrar" class="form" novalidate>
        <label>E-mail<input name="email" type="email" autocomplete="email" required></label>
        <label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
        <div class="duo"><label class="check"><input type="checkbox" data-olho> Mostrar senha</label><button type="button" class="link" data-painel="esqueci">Esqueci minha senha</button></div>
        <p class="erro" role="alert"></p>
        <button class="btn btn--ac" type="submit">Entrar</button>
      </form>
      <form id="fCriar" class="form" novalidate hidden>
        <label>Nome<input name="nome" type="text" autocomplete="name" required minlength="2"></label>
        <label>E-mail<input name="email" type="email" autocomplete="email" required></label>
        <label>Senha (mínimo de 6 caracteres)<input name="senha" type="password" autocomplete="new-password" required minlength="6"></label>
        <label>Pergunta de segurança (para recuperar a senha)<select name="perg" id="perg"></select></label>
        <label>Resposta<input name="resp" type="text" autocomplete="off" required></label>
        <label class="check"><input type="checkbox" data-olho> Mostrar senha</label>
        <p class="erro" role="alert"></p>
        <button class="btn btn--ac" type="submit">Criar conta</button>
      </form>
      <form id="fEsqueci" class="form" novalidate hidden>
        <h2 class="form__t">Recuperar senha</h2>
        <div id="passo1" class="form">
          <p class="dica">Digite o e-mail da sua conta. Vamos mostrar a pergunta de segurança que você escolheu no cadastro.</p>
          <label>E-mail<input name="email" type="email" autocomplete="email"></label>
        </div>
        <div id="passo2" class="form" hidden>
          <p class="dica" id="pergTxt"></p>
          <label>Sua resposta<input name="resp" type="text" autocomplete="off"></label>
          <label>Nova senha (mínimo de 6 caracteres)<input name="nova" type="password" autocomplete="new-password"></label>
          <label class="check"><input type="checkbox" data-olho> Mostrar senha</label>
        </div>
        <p class="erro" role="alert"></p>
        <button class="btn btn--ac" type="submit">Continuar</button>
        <button type="button" class="link" data-painel="entrar">Voltar ao login</button>
      </form>
    </div>
  </dialog>

  <!-- Aplicativo -->
  <div id="app">
    <header class="top">
      <div class="top__in">
        <a class="top__logo" href="#" data-ir="home" aria-label="TechMovies, início"><img src="img/logo.png" alt="" height="30"></a>
        <nav class="top__nav" aria-label="Principal">
          <button data-ir="home" class="on">Início</button>
          <button data-ir="lista">Minha lista</button>
          <button data-ir="planos">Planos</button>
        </nav>
        <label class="busca">
          <span class="sr">Pesquisar títulos</span>
          <input id="busca" type="search" placeholder="Pesquisar" autocomplete="off">
        </label>
        <div class="user">
          <button id="entrar" class="btn btn--ac" data-entrar>Entrar</button>
          <div id="userOn" class="user" hidden>
            <span id="uNome" class="user__nome"></span>
            <button id="sair" class="btn btn--vz">Sair</button>
          </div>
        </div>
      </div>
    </header>
    <main id="view"></main>
    <footer class="rodape">TechMovies, projeto de conclusão de curso. Desenvolvido por Inovation Coffee.</footer>
  </div>

  <dialog id="dlg" aria-label="Detalhes do título">
    <button class="fechar" data-fechar aria-label="Fechar">&times;</button>
    <div id="player" class="player"></div>
    <div id="info" class="info"></div>
  </dialog>

  <dialog id="dPlanos" aria-label="Planos">
    <button class="fechar" data-fechar aria-label="Fechar">&times;</button>
    <div id="planosBox" class="info"></div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
